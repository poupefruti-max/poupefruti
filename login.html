<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2E9E4F"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
  <title>Entre na sua conta | PoupeFruti</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23E8452C'/%3E%3Cpath d='M32 14c0-6 5-10 11-10-1 7-5 10-11 10z' fill='%232E9E4F'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="/api-config.js"></script>
  <style>
    :root{--green:#2e9e4f;--dark:#1f7a3b;--pale:#eaf6ed;--orange:#f2913d;--ink:#23301f;--muted:#55604f;--bg:#fbfdf8;--line:#e4eadf;--red:#a32a16;--redp:#fdedea;--font:"Nunito","Trebuchet MS",system-ui,sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 15% 18%,#fdf1e3 0,transparent 28%),linear-gradient(145deg,var(--pale),var(--bg) 54%);color:var(--ink);font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased}a{color:var(--dark);font-weight:700}:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:5px}.layout{min-height:100vh;max-width:1120px;margin:auto;padding:26px 24px;display:grid;grid-template-columns:1fr minmax(340px,460px);gap:clamp(40px,8vw,120px);align-items:center}.story{padding:22px 0}.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:22px;font-weight:800;color:var(--dark)}.fruit{display:grid;place-items:center;width:42px;height:42px;background:#fff;border-radius:50%;box-shadow:0 5px 16px #23301f14;font-size:23px}.eyebrow{margin:55px 0 12px;color:var(--dark);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px}.story h2{max-width:480px;font-size:clamp(38px,5vw,58px);line-height:1.08;letter-spacing:-.04em;margin:0 0 20px}.story p{max-width:450px;color:var(--muted);font-size:18px;margin:0}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:clamp(24px,4vw,38px);box-shadow:0 20px 60px #23301f12}.card h1{font-size:30px;line-height:1.2;margin:0 0 7px}.intro{margin:0 0 24px;color:var(--muted)}.field{margin:0 0 17px}.field label{display:block;font-weight:800;font-size:14px;margin:0 0 6px}.field input{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid #cbd5c5;border-radius:11px;background:#fff;color:var(--ink);font:inherit}.field input:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px #2e9e4f20}.field input[aria-invalid=true]{border-color:var(--red)}.input-wrap{position:relative}.input-wrap input{padding-right:82px}.toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--dark);font:700 13px var(--font);padding:8px;cursor:pointer}.error{display:block;color:var(--red);font-size:13px;font-weight:700;margin-top:4px}.alert{padding:12px 14px;border-radius:12px;margin:0 0 18px;font-weight:700;font-size:14px;background:var(--redp);color:var(--red);border:1px solid #f3c4bb}.submit,.secondary{display:flex;align-items:center;justify-content:center;width:100%;min-height:51px;border:0;border-radius:999px;background:var(--green);color:white;text-decoration:none;font:800 16px var(--font);cursor:pointer}.submit:hover{background:var(--dark)}.submit:disabled{opacity:.6;cursor:wait}.foot{text-align:center;color:var(--muted);font-size:14px;margin:20px 0 0}.home{text-align:center;margin:19px 0 0;font-size:13px}.status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:800px){.layout{grid-template-columns:1fr;max-width:540px;gap:15px;padding:20px 18px 35px}.story{padding:0}.eyebrow{margin:20px 0 7px}.story h2{font-size:30px;margin-bottom:8px}.story p{font-size:15px}.card{padding:25px 22px}.brand{font-size:19px}.fruit{width:36px;height:36px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="layout">
    <section class="story" aria-label="Sobre o PoupeFruti"><a class="brand" href="/" aria-label="PoupeFruti, voltar à página inicial"><span class="fruit" aria-hidden="true">🍊</span> PoupeFruti</a><p class="eyebrow">Mais frescor, menos desperdício</p><h2>Que bom ter você de volta.</h2><p>Entre para encontrar cestas de frutas e legumes perto de você.</p></section>
    <section class="card" aria-labelledby="form-title"><h1 id="form-title">Entrar na sua conta</h1><p class="intro">Use o e-mail e a senha cadastrados no PoupeFruti.</p><div id="form-error" class="alert" role="alert" hidden></div>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" required aria-describedby="email-error"><span id="email-error" class="error" hidden></span></div>
        <div class="field"><label for="password">Senha</label><div class="input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="password-error"><button class="toggle" type="button" aria-controls="password" aria-pressed="false">Mostrar</button></div><span id="password-error" class="error" hidden></span></div>
        <button id="submit" class="submit" type="submit">Entrar</button>
      </form>
      <p class="foot">Ainda não tem conta? <a href="/cadastro">Criar conta</a></p><p class="home"><a href="/">Voltar à página inicial</a></p>
    </section><p id="live-status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function(){"use strict";
      var API_URL=window.POUPEFRUTI_API_URL,TOKEN_KEY="poupefruti.painel.token",form=document.getElementById("login-form"),button=document.getElementById("submit"),busy=false,authStep="login";
      function errorBox(message){var box=document.getElementById("form-error");box.textContent=message||"";box.hidden=!message;}
      function fieldError(id,message){var input=document.getElementById(id),box=document.getElementById(id+"-error");box.textContent=message||"";box.hidden=!message;if(message)input.setAttribute("aria-invalid","true");else input.removeAttribute("aria-invalid");}
      function nextPath(){var value=new URLSearchParams(location.search).get("next");if(value==="/cestas"||value==="/painel"||value==="/")return value;return "/cestas";}
      document.querySelector(".toggle").addEventListener("click",function(){var input=document.getElementById("password"),show=input.type==="password";input.type=show?"text":"password";this.textContent=show?"Ocultar":"Mostrar";this.setAttribute("aria-pressed",String(show));this.setAttribute("aria-label",show?"Ocultar senha":"Mostrar senha");});
      form.addEventListener("input",function(e){errorBox("");if(e.target.id)fieldError(e.target.id,"");});
      form.addEventListener("submit",function(e){e.preventDefault();if(busy)return;var email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;fieldError("email",!email?"Informe seu e-mail.":(/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)?"":"Informe um e-mail válido."));fieldError("password",password?"":"Informe sua senha.");if(!email||!password||! /^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)){var first=form.querySelector('[aria-invalid="true"]');if(first)first.focus();return;}
        busy=true;authStep="login";button.disabled=true;button.textContent="Entrando…";document.getElementById("live-status").textContent="Validando suas credenciais.";
        fetch(API_URL+"/api/v1/auth/login",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({email:email,password:password})}).then(function(r){return r.json().catch(function(){return {};}).then(function(data){if(!r.ok)throw {status:r.status,code:data&&data.error&&data.error.code};return data;});}).then(function(data){if(!data.access_token)throw {status:500};sessionStorage.setItem(TOKEN_KEY,data.access_token);authStep="me";return fetch(API_URL+"/api/v1/auth/me",{headers:{"Accept":"application/json","Authorization":"Bearer "+data.access_token}}).then(function(r){if(!r.ok)throw {status:r.status};return r.json();});}).then(function(){location.replace(nextPath());}).catch(function(err){sessionStorage.removeItem(TOKEN_KEY);if(err&&err.status===401)errorBox(authStep==="login"?"E-mail ou senha inválidos. Confira os dados e tente novamente.":"A API não autorizou esta sessão. Entre novamente.");else if(err&&err.status===429)errorBox("Muitas tentativas. Aguarde um pouco e tente novamente.");else if(err&&err.status>=500)errorBox("O serviço respondeu com erro interno. Tente novamente em instantes.");else if(err&&err.status)errorBox("Não foi possível validar sua sessão. Entre novamente.");else errorBox("Não conseguimos conectar ao PoupeFruti. Verifique sua conexão e tente novamente.");}).finally(function(){busy=false;button.disabled=false;button.textContent="Entrar";});
      });
    }());
  </script>
</body>
</html>
